# Synth-test fixture: the full dev design (custom domains, models on). The shipped config
# may differ (infra/config/dev.yaml); these pin what the stacks build when everything is switched on.
env: dev
account: "123456789012"
region: us-east-1

mcp_domain: mcp.dev.watchfloor.example
auth_domain: auth.dev.watchfloor.example
harness_domain: harness.dev.watchfloor.example
certificate_arn: arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
hosted_zone_id: null               # set with hosted_zone_name to have CDK create the DNS records
hosted_zone_name: null

lwa_layer_arn: arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerArm64:25

models:
  sonnet: us.anthropic.claude-sonnet-5-5
  haiku: us.anthropic.claude-haiku-4-5-20251001-v1:0

alert_email: alerts@watchfloor.example
canary_email: daniel@lumenridge.example     # seeded user the canary signs in as (own generated password)
alexa_redirect_uris: []
budgets_usd: [25, 60, 90]          # account-wide (covers demo too); demo.yaml leaves this empty
models_enabled: true
demo_mode: false
provisioned_concurrency: 1
agent_image_tag: dev
removal_protection: false          # dev can be torn down; demo keeps its database
