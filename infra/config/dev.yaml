# Watchfloor dev environment (TD §11). Placeholders marked ⚠ must be replaced before `make deploy ENV=dev`.
env: dev
account: "863063109036"            # the Free plan account (profile `watchfloor`)
region: us-east-1

# No custom domains: a domain costs money the account's credits can't pay. certificate_arn stays
# null and the services answer on the hosts AWS assigns; `make cdk-deploy` writes them in below on
# the first deploy (scripts/default_hosts.py; README, Deploy). Commit them once they are there.
mcp_domain: null
auth_domain: null
harness_domain: null
certificate_arn: null
hosted_zone_id: null
hosted_zone_name: null

# ⚠ Verify the current arm64 Lambda Web Adapter layer version (TD §10.2).
lwa_layer_arn: arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerArm64:25

models:                            # ⚠ Verify (S6): inference profile ids available to the account
  sonnet: us.anthropic.claude-sonnet-5-5
  haiku: us.anthropic.claude-haiku-4-5-20251001-v1:0

alert_email: veditagrawal21@gmail.com          # SNS alarm and budget notifications (confirm the e-mail)
canary_email: daniel@lumenridge.example     # seeded user the canary signs in as (own generated password)
alexa_redirect_uris: []           # ⚠ S2: Alexa+ account-linking redirect URIs, once the skill exists
budgets_usd: [15, 25, 35]          # monthly usage before credits, account-wide; demo.yaml leaves this empty
models_enabled: false              # Free plan account: no AgentCore, no Claude (README, Deploy)
cdn: false                         # CloudFront refused until AWS Support verifies the account (ADR-015)
demo_mode: false
provisioned_concurrency: 0         # saves ~$9/month of the credits; cold starts instead
db_backup_days: 1                  # Free plan account: RDS backup retention is capped
agent_image_tag: dev
removal_protection: false          # dev can be torn down; demo keeps its database
