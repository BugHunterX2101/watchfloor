# Watchfloor demo environment: recording and judging, frozen Oct 22 – Nov 20 (DD §18.2, TD §17.5).
# Placeholders marked ⚠ must be replaced before `make deploy ENV=demo`.
env: demo
account: "863063109036"            # the Free plan account (profile `watchfloor`)
region: us-east-1

# No custom domains: a domain costs money the account's credits can't pay. certificate_arn stays
# null and the services answer on the hosts AWS assigns; `make cdk-deploy` writes them in below on
# the first deploy (scripts/default_hosts.py; README, Deploy). Commit them once they are there.
mcp_domain: null
auth_domain: null
harness_domain: null
certificate_arn: null
hosted_zone_id: null
hosted_zone_name: null

lwa_layer_arn: arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerArm64:25  # ⚠ Verify

models:                            # ⚠ Verify (S6)
  sonnet: us.anthropic.claude-sonnet-5-5
  haiku: us.anthropic.claude-haiku-4-5-20251001-v1:0

alert_email: alerts@watchfloor.example        # ⚠
canary_email: daniel@lumenridge.example     # seeded user the canary signs in as (own generated password)
alexa_redirect_uris: []           # ⚠ S2: Alexa+ account-linking redirect URIs, once the skill exists
budgets_usd: []                    # the account-wide budget lives in dev.yaml
models_enabled: false              # Free plan account: no AgentCore, no Claude (README, Deploy)
demo_mode: true                    # honours workspace clock offsets (DD §24)
provisioned_concurrency: 1
agent_image_tag: demo
removal_protection: true
