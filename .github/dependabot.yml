# Weekly update pull requests (docs/SECURITY.md). Each one runs ci.yml, and security.yml when a lock file
# changes. Pull requests only: nothing here can reach the deploy workflow, which runs on a push to main.
version: 2
updates:
  # Four separate uv projects, each with its own uv.lock (ADR-011).
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: uv
    directory: "/services/agents"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: uv
    directory: "/services/harness/api"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: uv
    directory: "/infra"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: "/services/harness/web"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      node-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: "/services/mcp_server/ui"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      node-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
