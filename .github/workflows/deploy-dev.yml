# main → dev (TD §12.2). Needs the repository secret AWS_DEPLOY_ROLE_DEV (GitHub OIDC role) and the
# variable AWS_ACCOUNT_ID. First deploy of a new account: see README, Deploy (bootstrap, agent image).
name: deploy-dev
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, id-token: write }
concurrency: deploy-dev

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: dev
    env: { ENV: dev, CDK_DEFAULT_ACCOUNT: "${{ vars.AWS_ACCOUNT_ID }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_DEV }}", aws-region: us-east-1 }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Tools for arm64 packaging (strip) and image builds (QEMU)
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build the views, the harness page and the Lambda zips
        run: |
          uv sync --frozen
          (cd services/mcp_server/ui && npm ci)
          (cd services/harness/web && npm ci && npm run build)
          (cd services/harness/api && uv sync --frozen)
          make package

      # The image is for AgentCore only: models_enabled, agents_enabled and agents_host: agentcore in
      # infra/config/dev.yaml (ADR-022, ADR-023). The config itself answers, so no flag is missed.
      - name: Agents enabled?
        id: agents
        working-directory: infra
        run: |
          uv sync --frozen
          uv run --frozen python -c 'from wf_infra.config import load_config as c; print("enabled=" + str(c("dev").agents_on).lower())' >> "$GITHUB_OUTPUT"

      # The first deploy with agents on has no image repository yet: deploy once without the runtime
      # (that creates the repository), push the image, and let the next step create the runtime.
      - name: Push the agents image
        if: steps.agents.outputs.enabled == 'true'
        run: |
          repo() { aws ecr describe-repositories --repository-names wf-dev-agents \
                     --query 'repositories[0].repositoryUri' --output text 2>/dev/null || true; }
          REPO=$(repo)
          if [ -z "$REPO" ] || [ "$REPO" = "None" ]; then
            (cd infra && uv sync --frozen)
            make cdk-deploy ENV=dev AGENT_RUNTIME=false CDK_FLAGS="--require-approval never"
            REPO=$(repo)
          fi
          make agents-image ENV=dev && make agents-push ENV=dev REPO="$REPO"

      # Without custom domains, make cdk-deploy writes the hosts AWS assigned into infra/config/dev.yaml
      # (twice-deploying on the first run, which assigns them); the steps below read them from there.
      - name: cdk deploy
        run: |
          (cd infra && uv sync --frozen)
          make cdk-deploy ENV=dev CDK_FLAGS="--require-approval never"
          git diff --quiet infra/config/dev.yaml || {
            echo "::notice::Commit these hosts to infra/config/dev.yaml:"; git diff -U0 infra/config/dev.yaml; }

      - name: Migrate (migrations + role logins)
        run: make migrate-remote ENV=dev

      - name: Seed (demo workspace reset, OAuth clients, logins)
        run: make seed-remote ENV=dev

      # Signs in as the canary user (secret wf-dev/canary/login; the deploy role needs
      # secretsmanager:GetSecretValue on it). The MCP domain comes from infra/config/dev.yaml.
      - name: Remote conformance (CF-01..15 except CF-04)
        run: make conformance-remote ENV=dev
