[project]
name = "watchfloor-core"
version = "1.0.0"
description = "Watchfloor domain core: RIGS engine, models, repositories, services."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "asyncpg>=0.29",
  "pyyaml>=6.0",
  "rfc8785>=0.1.4",
  "python-ulid>=3.0",
  "orjson>=3.10",
  "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchfloor_core"]
