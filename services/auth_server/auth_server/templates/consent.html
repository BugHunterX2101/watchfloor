<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allow access · Watchfloor</title>
  <style>
    :root { color-scheme: light dark; --fg: #1b1f24; --muted: #5b6573; --bg: #f6f7f9; --card: #fff; --accent: #1f5fd1; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e8ebef; --muted: #9aa4b2; --bg: #0f1216; --card: #171b21; --accent: #6a9cff; } }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 420px; margin: 10vh auto; padding: 28px; background: var(--card); border-radius: 12px; }
    h1 { font-size: 1.35rem; margin: 0 0 16px; }
    ul { padding-left: 1.2em; margin: 0 0 12px; }
    p.note { color: var(--muted); font-size: 0.92rem; }
    .actions { display: flex; gap: 12px; margin-top: 22px; }
    button { flex: 1; padding: 11px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .allow { color: #fff; background: var(--accent); border: 0; }
    .deny { color: inherit; background: transparent; border: 1px solid var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Allow {{ client_name }} to use Watchfloor?</h1>
  <p>It will be able to:</p>
  <ul>{% for line in scopes %}<li>{{ line }}</li>{% endfor %}</ul>
  <p class="note">Watchfloor never acts without your confirmation. You can disconnect at any time.</p>
  <form method="post" action="/consent">
    <input type="hidden" name="ticket" value="{{ ticket }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="actions">
      <button class="deny" type="submit" name="decision" value="deny">Not now</button>
      <button class="allow" type="submit" name="decision" value="allow">Allow</button>
    </div>
  </form>
</main>
</body>
</html>
