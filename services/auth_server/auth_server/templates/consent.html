<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Allow access · Watchfloor</title>
  <style>
{% include "_room.css" %}
    :root { --page: 420px; }
    h1 { margin-bottom: 18px; }
    ul { margin: 0 0 16px; padding: 0; list-style: none; }
    li { position: relative; padding: 8px 0 8px 22px; border-top: 1px solid var(--line); }
    li:last-child { border-bottom: 1px solid var(--line); }
    li::before { content: ""; position: absolute; left: 4px; top: 0.95em; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--signal); }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .actions button { flex: 1; }
  </style>
</head>
<body>
<p class="brand"><i aria-hidden="true"></i>Watchfloor</p>
<main>
  <h1>Allow {{ client_name }} to use Watchfloor?</h1>
  <p>It will be able to:</p>
  <ul>{% for line in scopes %}<li>{{ line }}</li>{% endfor %}</ul>
  <p class="note">Watchfloor never acts without your confirmation. You can disconnect at any time.</p>
  <form method="post" action="/consent">
    <input type="hidden" name="ticket" value="{{ ticket }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="actions">
      <button class="secondary" type="submit" name="decision" value="deny">Not now</button>
      <button class="primary" type="submit" name="decision" value="allow">Allow</button>
    </div>
  </form>
</main>
<p class="foot"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
</body>
</html>
