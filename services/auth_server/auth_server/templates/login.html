<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Watchfloor</title>
  <style>
{% include "_room.css" %}
    .primary { width: 100%; margin-top: 26px; }
  </style>
</head>
<body>
<p class="brand"><i aria-hidden="true"></i>Watchfloor</p>
<main>
  <h1>Sign in to Watchfloor</h1>
  <p class="lead">{{ client_name }} wants to connect to your pipeline.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    {% for name, value in hidden.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">
    {% endfor %}<input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Continue</button>
  </form>
</main>
<p class="foot"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
</body>
</html>
