<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Watchfloor">
  <!-- A health ring, open at one end, with the sentinel dot in the gap; the orb inside is the assistant. -->
  <defs>
    <linearGradient id="ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fe0c8"/>
      <stop offset=".55" stop-color="#3aa8e8"/>
      <stop offset="1" stop-color="#7c8cff"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#d6fff7"/>
      <stop offset=".45" stop-color="#33d1bb"/>
      <stop offset="1" stop-color="#176b8f"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round" stroke-dasharray="127.4 36" transform="rotate(-90 32 32)"/>
  <circle cx="32" cy="32" r="15" fill="url(#orb)"/>
  <ellipse cx="27" cy="26.5" rx="5" ry="3.2" fill="#fff" opacity=".55" transform="rotate(-25 27 26.5)"/>
  <circle cx="15.46" cy="11.94" r="3.2" fill="#4fe0c8"/>
</svg>
