[project]
name = "watchfloor-harness"
version = "1.0.0"
description = "Simulated Alexa+ harness (DD §17): OAuth 2.1 PKCE sign-in and a chat turn over the Watchfloor MCP server."
requires-python = ">=3.12,<3.13"
dependencies = [
  "watchfloor-core",
  "strands-agents>=1.0",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_api"]

# Not a workspace member: strands-agents pins mcp<2.2 (ADR-011), so this project has its own uv.lock.
# The harness speaks MCP over plain JSON-RPC (mcp_http.py) and never imports the mcp SDK itself.
[tool.uv.sources]
watchfloor-core = { path = "../../../packages/core", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
