[project]
name = "watchfloor-workers"
version = "1.0.0"
description = "Watchfloor background workers: watcher, sweeper, dispatcher, canary."
requires-python = ">=3.12,<3.13"
dependencies = [
  "watchfloor-core",
  "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "aws-lambda-powertools>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers"]
