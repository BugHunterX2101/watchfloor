<!doctype html>
<!-- Source of the Alexa+ listing images (addon.json mediaAssets); scripts/addon_assets/render.py
     screenshots it with headless Chrome. ?icon renders the square icon at the window size, otherwise
     the 600x900 carousel image. The orb, colours and fonts are the harness's (styles.css); the two
     deals are the seeded demo board (db/seed/scenarios.py). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Fraunces"; font-weight: 100 900;
    src: url("../../services/harness/web/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Geist"; font-weight: 100 900;
    src: url("../../services/harness/web/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900;
    src: url("../../services/harness/web/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2"); }
  :root {
    --bg: #080b11; --surface: #14181e; --raised: #1b2028; --text: #e8ecf3; --muted: #98a2b4;
    --orb-1: #4fe0c8; --orb-2: #3aa8e8; --orb-3: #7c8cff; --crit: #ff8f84;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); }
  body { font-family: "Geist", system-ui, sans-serif; }

  .orb { position: relative; width: var(--size); height: var(--size); border-radius: 50%; isolation: isolate; }
  .orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 200deg, var(--orb-1), var(--orb-2), var(--orb-3), var(--orb-2), var(--orb-1));
    filter: blur(calc(var(--size) * 0.06)) saturate(1.1);
    box-shadow: 0 0 calc(var(--size) * 0.6) calc(var(--size) * -0.1) color-mix(in srgb, var(--orb-1) 55%, transparent); }
  .orb::after { content: ""; position: absolute; inset: 14%; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, rgb(255 255 255 / 0.85), transparent 30%),
                radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--bg) 55%, transparent), transparent 70%);
    mix-blend-mode: soft-light; }

  /* icon: the orb alone, centred on the night background */
  body.icon { display: grid; place-items: center;
    background: radial-gradient(circle at 50% 45%, #0f1622, var(--bg) 70%); }
  body.icon .orb { --size: 62vw; }

  /* carousel: 600 x 900 */
  body.carousel { padding: 64px 44px 52px; display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse 80% 45% at 50% 18%, rgb(79 224 200 / 0.10), transparent 70%),
      linear-gradient(rgb(255 255 255 / 0.025) 1px, transparent 1px) 0 0 / 100% 32px,
      linear-gradient(90deg, rgb(255 255 255 / 0.025) 1px, transparent 1px) 0 0 / 32px 100%,
      var(--bg); }
  .head { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .head .orb { --size: 132px; margin-bottom: 40px; }
  .eyebrow { font: 600 13px/1 "Geist Mono", monospace; letter-spacing: 0.22em; color: var(--muted); }
  h1 { font: 500 58px/1.02 "Fraunces", Georgia, serif; margin: 14px 0 16px; letter-spacing: -0.01em; }
  .lede { font: 400 21px/1.45 "Geist", sans-serif; color: var(--muted); margin: 0; max-width: 460px; text-wrap: balance; }

  .board { margin-top: auto; display: grid; gap: 12px; }
  .ask { justify-self: end; font: 400 17px/1.3 "Geist"; padding: 12px 16px; border-radius: 16px 16px 4px 16px;
    background: var(--raised); }
  .deal { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    padding: 16px 18px; border-radius: 14px; background: var(--surface); border: 1px solid rgb(255 255 255 / 0.06); }
  .score { font: 600 28px/1 "Geist Mono"; width: 56px; text-align: center; color: var(--crit); }
  .score small { display: block; font: 500 10.5px/1 "Geist Mono"; letter-spacing: 0.08em; color: var(--muted); margin-top: 6px; }
  .name { font: 600 17px/1.25 "Geist"; }
  .why { font: 400 14.5px/1.35 "Geist"; color: var(--muted); margin-top: 3px; }
  .band { font: 600 11.5px/1 "Geist Mono"; letter-spacing: 0.08em; padding: 7px 9px; border-radius: 999px;
    color: #1a0503; background: var(--crit); }
  .foot { margin-top: 18px; text-align: center; font: 500 14px/1.3 "Geist Mono"; color: var(--muted); }
</style>
</head>
<body>
<script>
  const icon = new URLSearchParams(location.search).has("icon");
  document.body.className = icon ? "icon" : "carousel";
  document.body.innerHTML = icon
    ? '<div class="orb"></div>'
    : `<div class="head">
         <div class="orb"></div>
         <div class="eyebrow">WATCHFLOOR</div>
         <h1>Your pipeline,<br>on watch.</h1>
         <p class="lede">Hear which deals are slipping and why, then act by voice. Nothing happens without your yes.</p>
       </div>
       <div class="board">
         <div class="ask">"What's at risk in my pipeline?"</div>
         <div class="deal"><div class="score">29<small>HEALTH</small></div>
           <div><div class="name">Kestrel Biotech</div><div class="why">No reply in 16 days · close date pushed twice</div></div>
           <div class="band">AT RISK</div></div>
         <div class="deal"><div class="score">34<small>HEALTH</small></div>
           <div><div class="name">Harbor &amp; Pine Logistics</div><div class="why">No reply in 11 days · close date pushed</div></div>
           <div class="band">AT RISK</div></div>
         <div class="foot">Confirm before anything changes · undo for 30 seconds</div>
       </div>`;
</script>
</body>
</html>
